name: Race

# Runs benchmarks/race/race.py on a Linux runner against every checker we can
# install, uploads the JSON, and fails if any checker rejects a valid
# certificate or Certus accepts a tampered one. Four rounds: the explicit and
# the automated (simp/omega) proof, each as 1 theorem and as 1,000 copies.

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - benchmarks/race/**
      - .github/workflows/race.yml

permissions:
  contents: read

concurrency:
  group: race-${{ github.ref }}
  cancel-in-progress: true

env:
  LEAN_TOOLCHAIN: leanprover/lean4:v4.36.0
  # Pinned so the numbers are comparable between runs.
  LEAN4EXPORT_REV: df81913eee5519d5a88ae5b0fd701b5298cc29ab
  NANODA_REV: 0da9f98feadd3a0a2ef4b3dbcf52a298a6fef929
  CONLECHE_REV: 5ea446d5c79d23ef1f954215d094db2162f1ab6f
  METAMATH_REV: 580b4bd5ae6f2a0d746398b0033cddccba1b418b
  SETMM_REV: 844c01282c43f4ed03a8d302f19cd971a3a2be8c

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean (elan)
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$LEAN_TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          prefix="$("$HOME/.elan/bin/lean" --print-prefix)"
          # The toolchain's own bin (not elan's proxies) so race.py finds lib/lean.
          echo "$prefix/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/race-bin"
          echo "$HOME/race-bin" >> "$GITHUB_PATH"
          "$prefix/bin/lean" --version
          ls "$prefix/bin"

      - name: Cache tool builds
        uses: actions/cache@v4
        with:
          path: |
            ~/tools/lean4export/.lake
            ~/tools/con-leche/.lake
            ~/tools/cargo
          key: race-tools-${{ runner.os }}-${{ env.LEAN_TOOLCHAIN }}-${{ env.LEAN4EXPORT_REV }}-${{ env.CONLECHE_REV }}-${{ env.NANODA_REV }}

      - name: lean4export (from source)
        run: |
          set -euo pipefail
          d="$HOME/tools/lean4export"
          mkdir -p "$d" && cd "$d"
          [ -d .git ] || git init -q
          git fetch -q --depth 1 https://github.com/leanprover/lean4export "$LEAN4EXPORT_REV"
          git checkout -q FETCH_HEAD
          echo "$LEAN_TOOLCHAIN" > lean-toolchain
          lake build
          ln -sf "$d/.lake/build/bin/lean4export" "$HOME/race-bin/leanexport"

      - name: nanoda (from source)
        run: |
          set -euo pipefail
          cd "$HOME"   # outside the repo, so its rust-toolchain.toml does not apply
          cargo install --locked --git https://github.com/ammkrn/nanoda_lib --rev "$NANODA_REV" \
            --root "$HOME/tools/cargo" nanoda_lib
          ln -sf "$HOME/tools/cargo/bin/nanoda_bin" "$HOME/race-bin/nanoda_bin"

      - name: con-leche (from source)
        run: |
          set -euo pipefail
          d="$HOME/tools/con-leche"
          mkdir -p "$d" && cd "$d"
          [ -d .git ] || git init -q
          git fetch -q --depth 1 https://github.com/leanprover/con-leche "$CONLECHE_REV"
          git checkout -q FETCH_HEAD
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          lake build con-leche
          ln -sf "$d/.lake/build/bin/con-leche" "$HOME/race-bin/con-leche"

      - name: Metamath and set.mm
        run: |
          set -euo pipefail
          mm=benchmarks/proof-bench/metamath
          mkdir -p "$mm/src"
          curl -sSfL "https://github.com/metamath/metamath-exe/archive/$METAMATH_REV.tar.gz" \
            | tar -xzf - -C "$mm/src" --strip-components 1
          cc -O2 -o "$mm/metamath" "$mm"/src/src/*.c
          curl -sSfL -o "$mm/set.mm" "https://raw.githubusercontent.com/metamath/set.mm/$SETMM_REV/set.mm"

      - name: Tool versions
        run: |
          which lean leanexport leanchecker nanoda_bin con-leche
          lean --version

      - name: Build Certus
        run: cargo build --release

      - name: Race
        run: |
          set -o pipefail
          status=0
          python3 benchmarks/race/race.py --runs 5 --json race.json --require all | tee race.md || status=$?
          { echo "# Race (${{ runner.os }}, $(nproc) cores)"; cat race.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-results
          path: |
            race.json
            race.md
          if-no-files-found: warn
